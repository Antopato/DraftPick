services:
  - type: web
    name: draftpick-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Neon Postgres connection string; set in the Render dashboard (secret).
      - key: DATABASE_URL
        sync: false
      # Frontend origin(s), comma-separated, e.g. https://draftpick.vercel.app
      - key: CORS_ORIGINS
        sync: false
